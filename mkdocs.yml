site_name: MetaRPC MT4 Golang Documentation
site_url: https://mt4go.mrpc.pro/
repo_name: MetaRPC/GoMT4
repo_url: https://github.com/MetaRPC/GoMT4
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:

    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - toc.follow

    - content.code.copy
    - content.action.edit         
    - content.tabs.link           
    - search.highlight            
    - search.suggest              
    - palette.toggle
    - palette.auto
  custom_dir: docs/includes

extra_css:
  - styles/custom.css

extra_javascript:
  - javascripts/ux.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MetaRPC/GoMT4
      name: GitHub
  generator: false
  
  consent:
    title: Cookies & telemetry
    description: We use GitHub Pages basic analytics only. No tracking cookies.

copyright: >
  © {{ date | strftime("%Y") }} MetaRPC. MT4 is a MetaQuotes software. This site is a community-made documentation.

nav:
  - Home: index.md

  - Guides:
      - Getting Started: All_Guides/GETTING_STARTED.md
      - Your First Project: All_Guides/Your_First_Project.md
      - MT4 for Beginners: All_Guides/MT4_For_Beginners.md
      - Project Map: All_Guides/PROJECT_MAP.md
      - Glossary: All_Guides/GLOSSARY.md
      - gRPC Streaming: All_Guides/GRPC_STREAM_MANAGEMENT.md
      - Return Codes: All_Guides/RETURN_CODES_REFERENCE.md
      - ENUMs Reference: All_Guides/ENUMS_USAGE_REFERENCE.md
      - Concurrency Model: All_Guides/SYNC_VS_ASYNC.md
      - Protobuf Inspector: All_Guides/PROTOBUF_INSPECTOR_GUIDE.md

  - API Reference:
      - MT4Account API: MT4Account/Overview.md
      - MT4Service API: MT4Service/Overview.md
      - MT4Sugar API: MT4Sugar/Overview.md

  - Strategies:
      - Master Overview: Strategies/Strategies.Master.Overview.md
      - Market One-Shot: Strategies/Orchestrators/MarketOneShot.md
      - Bracket + Trailing: Strategies/Orchestrators/BracketTrailing.md
      - Pending Bracket: Strategies/Orchestrators/PendingBracket.md
      - Presets: Strategies/Presets/Presets.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - md_in_html
  - tables
  - toc:
      permalink: true
  - codehilite
  - pymdownx.inlinehilite
  - pymdownx.highlight
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - def_list
  - abbr
  - footnotes
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.critic
  - pymdownx.emoji:     
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg


plugins:
  - search
