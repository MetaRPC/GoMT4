name: Documentation preview checks

on:
  pull_request:
    paths: ['docs/**', 'mkdocs.yml', 'requirements-docs.txt', 'scripts/verify-doc-routes.py', '.github/workflows/docs-preview.yml']
  push:
    branches: ['codex/traffic-doc-route-recovery']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - run: python scripts/verify-doc-routes.py
      - uses: actions/upload-artifact@v4
        with:
          name: gomt4-documentation-preview
          path: site/
          retention-days: 14
